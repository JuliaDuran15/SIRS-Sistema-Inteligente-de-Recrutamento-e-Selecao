name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sirs
          POSTGRES_PASSWORD: sirs123
          POSTGRES_DB: sirs_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sirs -d sirs_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL:           postgresql://sirs:sirs123@localhost:5432/sirs_db
      CELERY_BROKER_URL:      redis://localhost:6379/0
      CELERY_RESULT_BACKEND:  redis://localhost:6379/0
      SECRET_KEY:             ci-secret-key-not-used-in-prod
      ALGORITHM:              HS256
      UPLOAD_DIR:             /tmp/uploads

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements-ci.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Instala dependências
        run: pip install -r requirements-ci.txt

      - name: Lint (ruff)
        run: ruff check app/

      - name: Roda testes
        run: pytest tests/ -v --tb=short -q

  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala dependências
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint
